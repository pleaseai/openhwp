name: Release

# Builds signed + notarized macOS installers for a published release, attaches
# them to it, updates the Homebrew cask, and publishes the JSR package.
#
# Triggered by the GitHub Release that release-please publishes when its PR
# merges. That event fires only because release-please runs with a GitHub App
# token (see release-please.yml) — the default GITHUB_TOKEN does not trigger
# downstream workflows.
#
# macOS signing is handled by `deno desktop` itself: with
# desktop.macos.codesignIdentity set it signs the app bundle (including the CEF
# framework and helper apps) and applies Hardened Runtime plus a secure
# timestamp. The .dmg container it wraps that bundle in is left unsigned, so
# this workflow signs the container and notarizes it. The identity is injected
# below rather than committed, so a contributor without the certificate can
# still build.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)build, e.g. v0.1.1
        required: true
        type: string

permissions: {}

jobs:
  build-macos:
    name: build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # deno desktop has no universal-binary flag, so each arch is built on
          # its own runner. .dmg creation requires a macOS host.
          - runner: macos-14
            target: aarch64-apple-darwin
            arch: darwin-arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: darwin-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      # Vite needs Node to build the embedded studio bundle.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Materialize upstream rhwp (sparse, pinned)
        run: deno task setup

      - name: Build the studio bundle
        run: deno task build:studio

      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          # Fail rather than fall back to an ad-hoc signature. Every trigger for
          # this workflow publishes its output to a GitHub Release and the
          # Homebrew tap, and Gatekeeper rejects an ad-hoc signed app on every
          # machine except the one that built it.
          if [ -z "${CERT_P12_BASE64:-}" ]; then
            echo "APPLE_CERTIFICATE_P12_BASE64 is not set; refusing to publish an unsigned build." >&2
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Allow codesign to use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # Keep the login keychain in the search list so system roots resolve.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Configure signing identity
        env:
          IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -z "${IDENTITY:-}" ]; then
            echo "APPLE_SIGNING_IDENTITY variable is not set, but a certificate was provided." >&2
            exit 1
          fi
          tmp="$(mktemp)"
          jq --arg id "$IDENTITY" \
            '.desktop.macos.codesignIdentity = $id' apps/desktop/deno.json > "$tmp"
          mv "$tmp" apps/desktop/deno.json

      - name: Build .dmg
        run: |
          set -euo pipefail
          # Build into a per-arch directory rather than an arch-suffixed
          # filename: deno desktop derives CFBundleName from the output file
          # name, so `-o OpenHWP-darwin-arm64.dmg` would name the app that too.
          mkdir -p "dist/${{ matrix.arch }}"
          cd apps/desktop
          deno desktop \
            --allow-net --allow-read --allow-env \
            --include ../studio-host/dist \
            --target ${{ matrix.target }} \
            --output "../../dist/${{ matrix.arch }}/OpenHWP.dmg" \
            main.ts
          cd ../..
          mv "dist/${{ matrix.arch }}/OpenHWP.dmg" "dist/OpenHWP-${{ matrix.arch }}.dmg"

      - name: Sign nested code, verify, and sign the disk image
        env:
          IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          ARCH="${{ matrix.arch }}"
          APP="dist/$ARCH/OpenHWP.app"
          DMG="dist/OpenHWP-$ARCH.dmg"

          # `deno desktop` signs only two objects — Contents/MacOS/*.dylib and
          # the outer bundle. The CEF framework, the helper .apps and the CEF
          # libraries keep the signature they shipped with, which is not ours.
          # The notary service requires every nested Mach-O to carry a Developer
          # ID signature and the hardened runtime, so re-sign inside-out: nested
          # code first, outer bundle last, or the outer seal is invalidated.
          sign() {
            codesign --force --sign "$IDENTITY" --timestamp --options runtime "$@"
          }

          while IFS= read -r lib; do
            sign "$lib"
          done < <(find "$APP/Contents/Frameworks" -name '*.dylib' -type f)

          while IFS= read -r helper; do
            sign "$helper"
          done < <(find "$APP/Contents/Frameworks" -maxdepth 1 -name '*.app')

          FW="$APP/Contents/Frameworks/Chromium Embedded Framework.framework"
          [ -d "$FW" ] && sign "$FW"

          while IFS= read -r dylib; do
            sign "$dylib"
          done < <(find "$APP/Contents/MacOS" -name '*.dylib' -type f)

          sign "$APP"

          # Every Mach-O must now be ours, hardened, and not ad-hoc. Checking
          # here converts an opaque "Invalid" from the notary service into a
          # named file, and costs seconds instead of a notarization round trip.
          FAILED=0
          while IFS= read -r obj; do
            SIG="$(codesign -dv "$obj" 2>&1 || true)"
            case "$SIG" in
              *"Signature=adhoc"*)      echo "::error::ad-hoc signature: $obj"; FAILED=1 ;;
              *"not signed at all"*)    echo "::error::unsigned: $obj"; FAILED=1 ;;
              *"TeamIdentifier=not set"*) echo "::error::no Team ID: $obj"; FAILED=1 ;;
            esac
            grep -q 'flags=.*runtime' <<< "$SIG" || {
              echo "::error::hardened runtime missing: $obj"; FAILED=1
            }
          done < <(
            find "$APP" -type f -perm +111 -exec sh -c 'file -b "$1" | grep -q Mach-O' _ {} \; -print
            find "$APP/Contents/Frameworks" -maxdepth 1 \( -name '*.app' -o -name '*.framework' \)
          )
          [ "$FAILED" -eq 0 ] || {
            echo "Nested code is not uniformly signed; the notary service would reject this." >&2
            exit 1
          }
          codesign --verify --deep --strict --verbose=2 "$APP"

          # The .app inside the .dmg is now stale, so rebuild the container from
          # the re-signed bundle rather than shipping the original.
          STAGE="$RUNNER_TEMP/dmg-stage"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/OpenHWP.app"
          ln -s /Applications "$STAGE/Applications"
          rm -f "$DMG"
          hdiutil create -volname OpenHWP -srcfolder "$STAGE" -ov -format UDZO "$DMG"

          # Apple expects the notarized and stapled artifact to be signed too.
          codesign --force --sign "$IDENTITY" --timestamp "$DMG"
          codesign --verify --strict --verbose=2 "$DMG"

      - name: Notarize and staple
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          # Same reasoning as the certificate: a signed but un-notarized build
          # is still refused by Gatekeeper, so a missing key is a hard error.
          for v in API_KEY_ID API_ISSUER_ID API_KEY_P8_BASE64; do
            if [ -z "${!v:-}" ]; then
              echo "APPLE_$v is not set; cannot notarize." >&2
              exit 1
            fi
          done
          DMG="dist/OpenHWP-${{ matrix.arch }}.dmg"
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$API_KEY_P8_BASE64" | base64 --decode > "$KEY"
          trap 'rm -f "$KEY"' EXIT

          # `notarytool submit` reports only "status: Invalid" on a rejection —
          # the per-binary reasons live in the submission log, which is
          # unreachable once the runner is gone. Capture the id and fetch it.
          OUT="$RUNNER_TEMP/notarize.txt"
          set +e
          xcrun notarytool submit "$DMG" \
            --key "$KEY" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" \
            --wait --timeout 30m 2>&1 | tee "$OUT"
          RC=${PIPESTATUS[0]}
          set -e

          SUBMISSION_ID="$(awk '/^ *id: /{print $2; exit}' "$OUT")"
          if [ "$RC" -ne 0 ] || ! grep -q 'status: Accepted' "$OUT"; then
            echo "::error::Notarization did not succeed; fetching the submission log."
            if [ -n "$SUBMISSION_ID" ]; then
              xcrun notarytool log "$SUBMISSION_ID" \
                --key "$KEY" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" || true
            else
              echo "No submission id was reported, so there is no log to fetch." >&2
            fi
            exit 1
          fi

          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenHWP-${{ matrix.arch }}.dmg
          path: dist/OpenHWP-${{ matrix.arch }}.dmg
          if-no-files-found: error

  release-assets:
    name: attach release assets
    needs: build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets
          merge-multiple: true

      - name: Checksums
        run: cd assets && shasum -a 256 OpenHWP-* > SHA256SUMS

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" assets/* --repo "${{ github.repository }}" --clobber

  update-homebrew-cask:
    # Reads the published checksums and rewrites Casks/openhwp.rb in
    # pleaseai/homebrew-tap. Keep the cask template below in sync with
    # packaging/homebrew/openhwp.rb.
    name: update Homebrew cask
    needs: release-assets
    runs-on: ubuntu-latest
    steps:
      - name: Mint tap token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          owner: pleaseai
          repositories: |
            openhwp
            homebrew-tap

      - name: Checkout homebrew-tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pleaseai/homebrew-tap
          token: ${{ steps.app-token.outputs.token }}
          path: homebrew-tap

      - name: Update cask
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Validate the tag before use so an untrusted dispatch input cannot
          # inject shell into this step.
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Unexpected release tag format: $TAG" >&2
            exit 1
          }
          VERSION="${TAG#v}"

          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern SHA256SUMS \
            --dir checksums \
            --clobber
          sha() { awk -v f="OpenHWP-$1.dmg" '$NF == f {print $1}' checksums/SHA256SUMS; }
          ARM64_SHA256="$(sha darwin-arm64)"
          X64_SHA256="$(sha darwin-x64)"
          [ -n "$ARM64_SHA256" ] && [ -n "$X64_SHA256" ] || {
            echo "Missing checksums for one or both architectures" >&2
            exit 1
          }

          mkdir -p homebrew-tap/Casks
          cat > homebrew-tap/Casks/openhwp.rb << 'CASK_EOF'
          cask "openhwp" do
            arch arm: "darwin-arm64", intel: "darwin-x64"

            version "VERSION_PLACEHOLDER"
            sha256 arm:   "SHA256_ARM64_PLACEHOLDER",
                   intel: "SHA256_X64_PLACEHOLDER"

            url "https://github.com/pleaseai/openhwp/releases/download/v#{version}/OpenHWP-#{arch}.dmg"
            name "OpenHWP"
            desc "Open-source HWP/HWPX desktop editor"
            homepage "https://github.com/pleaseai/openhwp"

            depends_on macos: ">= :monterey"

            app "OpenHWP.app"

            zap trash: [
              "~/Library/Application Support/dev.pleaseai.openhwp",
              "~/Library/Caches/dev.pleaseai.openhwp",
              "~/Library/Preferences/dev.pleaseai.openhwp.plist",
              "~/Library/Saved Application State/dev.pleaseai.openhwp.savedState",
            ]
          end
          CASK_EOF

          sed -i \
            -e "s/VERSION_PLACEHOLDER/$VERSION/g" \
            -e "s/SHA256_ARM64_PLACEHOLDER/$ARM64_SHA256/g" \
            -e "s/SHA256_X64_PLACEHOLDER/$X64_SHA256/g" \
            homebrew-tap/Casks/openhwp.rb

          cd homebrew-tap
          if git diff --quiet -- Casks/openhwp.rb; then
            echo "Cask already up to date at $VERSION"
            exit 0
          fi
          git config user.name "pleaseai-release-bot[bot]"
          git config user.email "pleaseai-release-bot[bot]@users.noreply.github.com"
          git add Casks/openhwp.rb
          git commit -m "openhwp $VERSION"
          git push

  publish-jsr:
    # Namespace reservation only. @openhwp/desktop is the desktop shell's
    # entrypoint, not a library: importing it opens a window, and it resolves
    # the studio bundle from apps/studio-host/dist, which is gitignored and
    # therefore absent from the published package. `deno run jsr:@openhwp/desktop`
    # will exit with "studio bundle not found" by design — install via Homebrew
    # or the release .dmg instead. This job exists to hold the scope until there
    # is something genuinely importable to publish.
    name: publish to JSR (namespace)
    needs: release-assets
    # Disabled until the scope exists. Create @openhwp on jsr.io, link this
    # repository so OIDC publishing is trusted, then set the repository
    # variable JSR_PUBLISH_ENABLED=true. Without this gate the job would fail
    # on every release, since jsr.io/@openhwp currently 404s.
    if: vars.JSR_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC: JSR trusts the workflow identity, so no token is needed.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Publish
        working-directory: apps/desktop
        run: deno publish --allow-dirty
